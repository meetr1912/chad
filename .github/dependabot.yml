version: 2
updates:
  # Keep the workflow action pins (checkout, setup-uv, codeql, gitleaks) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Python deps via uv (reads pyproject.toml + uv.lock). Grouped so a routine bump
  # is one PR, not one-per-package. mlx/mlx-lm are hand-gated: see the ignore list.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: deps
    # These carry deliberate upper bounds in pyproject.toml, so a bump across the cap
    # can't resolve — Dependabot would otherwise reopen a red group PR every week.
    # Widen a cap by hand (after re-gating the loader / ABI) when you actually want
    # the next release.
    ignore:
      # mlx: >=0.32.0,!=0.32.1,<=0.32.2 — every release in that range was admitted by
      # hand, and patch bumps are ignored too because a patch is exactly how this broke
      # before: 0.32.1 produced degenerate generations against chad's custom kernels
      # (hotfixed in 2.0.1). No CI job measures generation quality, so a patch PR would
      # look like any other green bump. Re-gate the point release, then widen the pin.
      - dependency-name: "mlx"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # mlx-lm: >=0.31.3,<0.32 — same hand-gated treatment; chad's loading rides on its
      # qwen3_5/qwen3_5_moe loader, which a release can refactor without a signal here.
      - dependency-name: "mlx-lm"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      # transformers: >=5.0,<5.13 — 5.13 regressed AutoTokenizer.register (import crash).
      - dependency-name: "transformers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # numpy: >=1.26,<3 — the 2.x line is verified end-to-end, so this rule now guards
      # only the unreviewed 3.0 major.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
